<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numbr - Math Game with Archie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header>
            <h1>🦅 Numbr</h1>
            <div class="stats-header">
                <div class="stat-item">⚡ Energy: <span id="energy-count">30</span>/30</div>
                <div class="stat-item">✨ Level <span id="level-display">1</span> (<span id="xp-display">0</span> XP)</div>
            </div>
        </header>

        <!-- Grade Selection Screen -->
        <!-- Inside <div id="game-screen"> template block -->
<div class="mascot-box">
    <div id="archie-bubble" class="speech-bubble">Let's solve this!</div>
    <!-- Added id="archie-avatar" below -->
    <div id="archie-avatar" class="archie-avatar">🦅</div>
</div>

            <div class="archie-avatar">🦅</div>
            <div class="grade-buttons">
                <button class="grade-btn" onclick="startGame(1)">1st Grade</button>
                <button class="grade-btn" onclick="startGame(2)">2nd Grade</button>
                <button class="grade-btn" onclick="startGame(3)">3rd Grade</button>
                <button class="grade-btn" onclick="startGame(4)">4th Grade & Up</button>
            </div>
        </div>

        <!-- Main Gameplay Screen (Hidden initially) -->
        <div id="game-screen" class="screen hidden">
            <div class="mascot-box">
                <div id="archie-bubble" class="speech-bubble">Let's solve this!</div>
                <div class="archie-avatar">🦅</div>
            </div>

            <div class="timer-box">⏳ Time Left: <span id="timer-count">15</span>s</div>

            <main class="quiz-box">
                <div id="question">0 + 0 = ?</div>
                <input type="number" id="answer-input" placeholder="Your answer" autocomplete="off">
                <button id="submit-btn">Submit</button>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
